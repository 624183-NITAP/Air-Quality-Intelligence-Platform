# Render Blueprint specification for AeroPulse 2.0 Unified Web Service
# Single Web Service serving both built React frontend and Node.js Gemini API proxy
services:
  - type: web
    name: aeropulse-2
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard -> Environment
